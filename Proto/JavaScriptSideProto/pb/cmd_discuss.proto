syntax = "proto3";

package pbdiscuss;

message DiscussData {
    uint32 discussId = 1;
    uint32 choiceId = 2;
}

message GetDiscussDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1667;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
}

message GetDiscussDataRsp {

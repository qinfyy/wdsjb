syntax = "proto3";

package pbcountdown;

message CountdownInvestwallData {
    uint32 investwallId = 1;
    int64 openTime = 2;
    uint32 status = 3;
    repeated .pbcountdown.RewardDataItem rewards = 4;
}

message CountdownData {
    uint32 scheduleId = 1;
    int64 mainplotOpenTime = 2;
    repeated .pbcountdown.CountdownInvestwallData investwallList = 3;
}

message GetCountdownDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1461;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    uint32 scheduleId = 1;
}

message GetCountdownDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1462;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    int32 retcode = 1;
    .pbcountdown.CountdownData countdown = 2;
}

message CountdownInvestwallRewardReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1463;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    uint32 scheduleId = 1;
    uint32 investwallId = 2;
}

message CountdownInvestwallRewardRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1464;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    int32 retcode = 1;
    uint32 scheduleId = 2;
    uint32 investwallId = 3;
    repeated .pbcountdown.RewardDataItem rewards = 4;
}

message RewardDataItem {
    uint32 rewardType = 1;
    uint32 itemId = 2;
    uint32 itemLevel = 3;
    uint32 itemNum = 4;
    uint32 rewardId = 5;
    string rewardTextmapId = 6;
    uint32 decompose = 7;
    uint32 materialId = 8;
    uint32 materialNum = 9;
    uint32 coinId = 10;
    uint32 coinNum = 11;
    uint32 addItemNum = 12;
    int64 curItemNum = 13;
    uint32 showBonus = 14;
    uint32 rewardNameId = 15;
    uint32 uniqId = 16;
    uint32 expireUnixtime = 17;
    uint32 materialDecomposeNum = 18;
    uint32 showOldPlayer = 19;
    uint32 rewardItemTag = 20;
}

syntax = "proto3";

package pbpickup;

message PickupTaskData {
    uint32 taskGroupId = 1;
    uint32 curTaskId = 2;
    uint32 taskStatus = 3;
    int64 refreshEndTime = 4;
    uint32 curLevel = 5;
}

message PickupLevelData {
    uint32 levelId = 1;
    int32 maxScore = 2;
}

message PickupStoryData {
    uint32 storyId = 1;
    repeated .pbpickup.RewardDataItem rewards = 2;
}

message GetPickupDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1153;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    uint32 scheduleId = 1;
}

message GetPickupDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1154;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    int32 retcode = 1;
    uint32 scheduleId = 2;
    repeated .pbpickup.PickupTaskData taskGroupList = 3;
    repeated .pbpickup.PickupLevelData levelData = 4;
    repeated .pbpickup.PickupStoryData storyData = 5;
}

message PickupUnlockTaskReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1155;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    uint32 scheduleId = 1;
    uint32 taskGroupId = 2;
}

message PickupUnlockTaskRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1156;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    int32 retcode = 1;
    uint32 scheduleId = 2;
    uint32 taskGroupId = 3;
}

message PickupLevelEndReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1159;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    uint32 scheduleId = 1;
    uint32 taskGroupId = 2;
    uint32 levelId = 3;
    repeated uint32 pickupItemList = 4 [packed = true];
    int32 totalScore = 5;
}

message PickupLevelEndRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1160;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    int32 retcode = 1;
    uint32 levelId = 2;
    uint32 success = 3;
    int32 score = 4;
    uint32 taskFinish = 5;
    int32 lastMaxScore = 6;
}

message RewardDataItem {
    uint32 rewardType = 1;
    uint32 itemId = 2;
    uint32 itemLevel = 3;
    uint32 itemNum = 4;
    uint32 rewardId = 5;
    string rewardTextmapId = 6;
    uint32 decompose = 7;
    uint32 materialId = 8;
    uint32 materialNum = 9;
    uint32 coinId = 10;
    uint32 coinNum = 11;
    uint32 addItemNum = 12;
    int64 curItemNum = 13;
    uint32 showBonus = 14;
    uint32 rewardNameId = 15;
    uint32 uniqId = 16;
    uint32 expireUnixtime = 17;
    uint32 materialDecomposeNum = 18;
    uint32 showOldPlayer = 19;
    uint32 rewardItemTag = 20;
}

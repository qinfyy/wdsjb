syntax = "proto3";

package pbvip;

message VipLevelRewardItem {
    uint32 vipLevel = 1;
    uint32 dailyGot = 2;
    .pbvip.RewardDataItem dailyReward = 3;
    uint32 priviGot = 4;
    .pbvip.RewardDataItem priviReward = 5;
    uint32 weeklyGot = 6;
    repeated .pbvip.RewardDataItem weeklyReward = 7;
}

message GetVipRewardDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1149;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
}

message GetVipRewardDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1150;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    uint32 isAll = 1;
    repeated .pbvip.VipLevelRewardItem vipRewardItems = 2;
    uint32 vipWalletCostHistory = 3;
}

message ReceiveVipRewardReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1151;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    uint32 vipLevel = 1;
}

message ReceiveVipRewardRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1152;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    int32 retcode = 1;
    repeated .pbvip.RewardDataItem rewards = 2;
}

message RewardDataItem {
    uint32 rewardType = 1;
    uint32 itemId = 2;
    uint32 itemLevel = 3;
    uint32 itemNum = 4;
    uint32 rewardId = 5;
    string rewardTextmapId = 6;
    uint32 decompose = 7;
    uint32 materialId = 8;
    uint32 materialNum = 9;
    uint32 coinId = 10;
    uint32 coinNum = 11;
    uint32 addItemNum = 12;
    int64 curItemNum = 13;
    uint32 showBonus = 14;
    uint32 rewardNameId = 15;
    uint32 uniqId = 16;
    uint32 expireUnixtime = 17;
    uint32 materialDecomposeNum = 18;
    uint32 showOldPlayer = 19;
    uint32 rewardItemTag = 20;
}

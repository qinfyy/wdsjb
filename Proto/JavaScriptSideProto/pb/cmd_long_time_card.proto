syntax = "proto3";

package pblongtimecard;

message LongTimeCardInfo {
    uint32 longTimeCardId = 1;
    uint32 monthCardId = 2;
    uint32 progress = 3;
    uint32 status = 4;
    int64 leftTime = 5;
    repeated .pblongtimecard.LongTimeCardPackageInfo packageInfos = 6;
    repeated .pblongtimecard.LongTimeCardProgressRewardInfo rewardInfos = 7;
}

message LongTimeCardPackageInfo {
    uint32 packageId = 1;
    uint32 addProgress = 2;
}

message LongTimeCardProgressRewardInfo {
    uint32 needProgress = 1;
    repeated .pblongtimecard.RewardDataItem progressReward = 2;
}

message GetLongTimeCardDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1337;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    uint32 longTimeCardAll = 1;
    repeated uint32 longTimeCardId = 2 [packed = true];
}

message GetLongTimeCardDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1338;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    int32 retcode = 1;
    uint32 longTimeCardAll = 2;
    repeated .pblongtimecard.LongTimeCardInfo longTimeCardInfos = 3;
}

message RewardDataItem {
    uint32 rewardType = 1;
    uint32 itemId = 2;
    uint32 itemLevel = 3;
    uint32 itemNum = 4;
    uint32 rewardId = 5;
    string rewardTextmapId = 6;
    uint32 decompose = 7;
    uint32 materialId = 8;
    uint32 materialNum = 9;
    uint32 coinId = 10;
    uint32 coinNum = 11;
    uint32 addItemNum = 12;
    int64 curItemNum = 13;
    uint32 showBonus = 14;
    uint32 rewardNameId = 15;
    uint32 uniqId = 16;
    uint32 expireUnixtime = 17;
    uint32 materialDecomposeNum = 18;
    uint32 showOldPlayer = 19;
    uint32 rewardItemTag = 20;
}

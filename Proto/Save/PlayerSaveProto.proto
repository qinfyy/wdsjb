syntax = "proto3";

package PlayerSaveProto;

message PlayerSaveData {
    PlayerBasicComp playerdata = 2;
    WalletComp wallet_comp = 3;
    InventoryComp inventory_comp = 4;
    GuideComp guide_comp = 5;
    LevelComp level_comp = 6;
    StoryComp story_comp = 7;
}

message PlayerBasicComp {
    string nickname = 1;
    string language = 2;
    uint32 level = 3;
    uint32 exp = 4;
    uint32 stamina = 5;
    int64 create_time = 6;
    int64 last_stamina_time = 7;
    uint32 login_count = 8;
    int64 last_login_time = 9;
    uint32 last_rpc_id = 10;
    uint32 desk_display_id = 11;
}

message WalletComp {
    int64 hcoin = 1;
    int64 scoin = 2;
    int64 ycoin = 3;
    int64 friend_point = 4;
    map<uint32, int64> coins = 5;
    map<uint32, uint32> tickets = 6;
}

message InventoryComp {
    map<uint32, CardBin> cards = 1;
    map<uint32, DeckBin> decks = 2;
    map<uint32, uint32> materials = 3;
}

message CardBin {
    uint32 id = 1;
    uint32 level = 2;
    uint32 exp = 3;
    uint32 star = 4;
    uint32 evol_type = 5;
    int64 receive_time = 6;
    uint32 status = 7;
    uint32 display_type = 8;
    map<uint32, uint32> skills = 9;
    bool is_new = 10;
}

message DeckBin {
    uint32 id = 1;
    string name = 2;
    repeated uint32 main_cards = 3;
    repeated uint32 assist_cards = 4;
    int64 create_time = 5;
}

message GuideComp {
    map<uint32, uint32> guides = 1;
}

message LevelComp {
    map<uint32, LevelBin> levels = 1;
    uint32 active_level = 2;
    uint32 seed = 3;
    int64 begin_time = 4;
}

message LevelBin {
    uint32 id = 1;
    uint32 pass_count = 2;
    bool first_reward_claimed = 3;
}

message StoryComp {
    map<uint32, uint32> stories = 1;
}

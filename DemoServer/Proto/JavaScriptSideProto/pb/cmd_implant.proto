syntax = "proto3";

package pbimplant;

message ImplantItem {
    uint32 implantId = 1;
    uint32 implantStatus = 2;
}

message GetImplantDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1651;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }
    uint32 implantAll = 1;
    repeated uint32 implantIdList = 2 [packed = true];

        NONE = 0;
        CMD_ID = 1209;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    uint32 scheduleId = 1;

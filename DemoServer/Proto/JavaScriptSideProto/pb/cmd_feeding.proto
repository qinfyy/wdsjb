syntax = "proto3";

package pbfeeding;

message FeedingAnimalData {
    uint32 animalId = 1;
    uint32 getNum = 2;
}

message FeedingFoodData {
    uint32 foodId = 1;
    uint32 currPrice = 2;
    uint32 currDiscount = 3;
    uint32 remainNum = 4;
}

message FeedingStoryData {
    uint32 storyId = 1;
    repeated .pbfeeding.RewardDataItem rewards = 2;
}

message GetFeedingDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1203;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    uint32 scheduleId = 1;
}

message GetFeedingDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1204;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 0;
    }
    int32 retcode = 1;
    uint32 scheduleId = 2;
    int64 currTimestamp = 3;
    repeated uint32 currAnimals = 4 [packed = true];
    repeated .pbfeeding.FeedingAnimalData photographedAnimals = 5;
    repeated .pbfeeding.FeedingFoodData currFoods = 6;
    repeated .pbfeeding.FeedingStoryData storyInfos = 7;
    uint32 lastFlavorFoodId = 8;
}

message FeedingFoodReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1205;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    uint32 scheduleId = 1;
    uint32 mainFoodId = 2;
    uint32 mainFoodNum = 3;
    uint32 flavorFoodId = 4;
    uint32 flavorFoodNum = 5;
}

message FeedingFoodRsp {

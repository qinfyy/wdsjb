        NONE = 0;
        CMD_ID = 1206;
        IS_ALLOW_CLIENT = 0;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
    int32 retcode = 1;
}

message FeedingFoodInfiniteReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1207;
        IS_ALLOW_CLIENT = 1;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        REQUIRED_RPC_ID = 1;
    }
